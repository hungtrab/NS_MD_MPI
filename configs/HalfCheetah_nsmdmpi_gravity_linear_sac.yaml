# HalfCheetah NS-MD-MPI - Linear Gravity Drift - SAC
env_id: "HalfCheetah-v4"

env:
  parameter: "gravity"
  drift_type: "linear"
  magnitude: 3.0
  period: 250000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["halfcheetah", "nsmdmpi", "linear", "gravity", "sac"]
  mode: "online"

train:
  algorithm: "SAC"
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  total_timesteps: 1000000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: true
  V_R: 200.0
  V_P: 250.0
  V_pi_star: 125.0
  auto_estimate_budgets: false
  budget_scale_factor: 2.0
  
  kappa_base: 0.2
  kappa_min: 0.05
  kappa_max: 0.35
  kappa_adaptive: true
  trust_region_sensitivity: 0.25
  
  lambda_base: 1.0
  lambda_min: 0.2
  lambda_max: 5.0
  lambda_adaptive: true
  regularization_sensitivity: 0.6
  
  ema_tau: 0.04
  gamma: 0.99
  B_value_bound: 100.0
  
  drift_weights:
    reward: 1.0
    transition: 1.5
    commutator: 0.5
  
  drift_window_size: 5000
  drift_min_samples: 500
  
  adapt_entropy: true
  base_ent_coef: 0.2
  min_ent_coef: 0.05
  max_ent_coef: 0.5
  
  log_freq: 100
  save_budget_history: true
  budget_save_dir: "budgets/"
  verbose: 1

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
