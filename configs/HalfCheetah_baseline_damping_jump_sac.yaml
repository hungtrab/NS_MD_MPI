# HalfCheetah Baseline - Jump Damping Drift - SAC
env_id: "HalfCheetah-v4"

env:
  parameter: "damping"
  drift_type: "jump"
  magnitude: 0.5
  period: 500000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["halfcheetah", "baseline", "jump", "damping", "sac"]
  mode: "online"

train:
  algorithm: "SAC"
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  total_timesteps: 1000000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
