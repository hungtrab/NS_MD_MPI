# CartPole MULTI-PARAM - Gravity + Masscart Simultaneous Drift
# CẢ 2 tham số thay đổi CÙNG LÚC
# Mục đích: Dynamics phức tạp hơn nhiều - cả trọng lực và khối lượng đều thay đổi

env_id: "CartPole-v1"

# NOTE: CartPole wrapper hỗ trợ list of drift configs!
env:
  - parameter: "gravity"
    drift_type: "sine"
    magnitude: 5.0
    period: 500
    bounds: [4.0, 20.0]
  
  - parameter: "masscart"
    drift_type: "linear"
    magnitude: 0.6      # masscart: 1.0 ± 0.6 oscillating
    period: 400
    bounds: [0.4, 2.0]

wandb:
  project: "TuneEnv"
  tags: ["cartpole", "multi-param", "gravity", "masscart", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
