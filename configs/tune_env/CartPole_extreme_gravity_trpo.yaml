env_id: CartPole-v1
env:
  parameter: gravity
  drift_type: jump
  magnitude: 15.0
  period: 300
  bounds:
  - 5.0
  - 30.0
wandb:
  project: TuneEnv
  tags:
  - cartpole
  - extreme
  - gravity
  - jump
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42
  target_kl: 0.01
adaptive:
  enabled: false
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
