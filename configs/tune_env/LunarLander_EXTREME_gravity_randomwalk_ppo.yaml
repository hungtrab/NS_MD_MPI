# LunarLander EXTREME - Gravity Random Walk
# Moon → Jupiter gravity!

env_id: "LunarLander-v3"

env:
  parameter: "gravity"
  drift_type: "random_walk"
  sigma: 1.5            # EXTREME gravity variance
  bounds: [-1.0, -25.0] # Moon → 2.5x Earth

wandb:
  project: "TuneEnv"
  tags: ["lunarlander", "extreme", "gravity", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 300000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
