# CartPole Challenge - Scenario 2: Random Walk Gravity (HARDEST)
# Gravity thay đổi ngẫu nhiên mỗi step → không thể dự đoán
# Mục đích: Đây là scenario khó nhất, PPO baseline cực khó adapt

env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "random_walk"
  sigma: 0.5            # Step size khá lớn
  bounds: [3.0, 20.0]   # Giới hạn gravity

wandb:
  project: "TuneEnv"
  tags: ["cartpole", "extreme", "gravity", "random_walk", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
