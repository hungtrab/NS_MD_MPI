# =============================================================================
# CartPole Challenging Experiment - RECOMMENDED CONFIG
# =============================================================================
# File này chứa config "moderate" - điểm khởi đầu tốt để test
# 
# Các file config khác trong thư mục này (từ dễ → khó):
#   1. CartPole_moderate_randomwalk_baseline.yaml     ← BẮT ĐẦU TỪ ĐÂY
#   2. CartPole_length_jump_baseline.yaml             (pole length thay đổi)
#   3. CartPole_fastsine_gravity_baseline.yaml        (dao động nhanh)
#   4. CartPole_extreme_gravity_baseline.yaml         (gravity cực cao)
#   5. CartPole_randomwalk_gravity_baseline.yaml      ← KHÓ NHẤT (stochastic)
#
# Cách chạy:
#   python scripts/train.py --config configs/tune_env/Cartpole_exp.yaml
# =============================================================================

env_id: "CartPole-v1"

env:
  # MODERATE RANDOM WALK: Gravity thay đổi ngẫu nhiên nhưng vừa phải
  parameter: "gravity"
  drift_type: "random_walk"
  sigma: 0.2              # Moderate step size (không quá lớn)
  bounds: [5.0, 18.0]     # Giới hạn hợp lý

wandb:
  project: "TuneEnv"
  entity: null
  tags: ["cartpole", "moderate", "gravity", "random_walk", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
