env_id: CartPole-v1
env:
- parameter: gravity
  drift_type: random_walk
  sigma: 2.5
  bounds:
  - 1.0
  - 30.0
- parameter: masscart
  drift_type: jump
  magnitude: 1.5
  period: 30
  bounds:
  - 0.3
  - 3.0
- parameter: masspole
  drift_type: sine
  magnitude: 0.15
  period: 40
  bounds:
  - 0.01
  - 0.3
- parameter: length
  drift_type: random_walk
  sigma: 0.03
  bounds:
  - 0.2
  - 1.2
wandb:
  project: TuneEnv
  tags:
  - cartpole
  - ultra-extreme
  - all-4
  - insane
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 200000
  seed: 42
  target_kl: 0.01
adaptive:
  enabled: false
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
