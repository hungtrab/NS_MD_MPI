# CartPole Challenge - Scenario 5: Moderate Random Walk (RECOMMENDED START)
# Gravity random walk với sigma vừa phải
# Mục đích: Config "vừa phải" để bắt đầu thử nghiệm

env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "random_walk"
  sigma: 0.2            # Moderate random walk step
  bounds: [5.0, 18.0]   # Bounds hợp lý

wandb:
  project: "TuneEnv"
  tags: ["cartpole", "moderate", "gravity", "random_walk", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
