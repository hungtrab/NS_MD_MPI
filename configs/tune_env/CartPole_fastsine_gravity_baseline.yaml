# CartPole Challenge - Scenario 3: Fast Sine Gravity
# Gravity dao động nhanh với chu kỳ rất ngắn
# Mục đích: Agent không kịp học trước khi env thay đổi

env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "sine"
  magnitude: 10.0       # gravity: -0.2 đến 19.8
  period: 200           # Dao động cực nhanh (200 steps/cycle)
  bounds: [0.5, 25.0]

wandb:
  project: "TuneEnv"
  tags: ["cartpole", "extreme", "gravity", "fast_sine", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
