env_id: CartPole-v1
env:
- parameter: gravity
  drift_type: random_walk
  sigma: 0.5
  bounds:
  - 5.0
  - 18.0
- parameter: masscart
  drift_type: sine
  magnitude: 0.5
  period: 300
  bounds:
  - 0.5
  - 1.5
- parameter: masspole
  drift_type: jump
  magnitude: 0.05
  period: 200
  bounds:
  - 0.05
  - 0.2
- parameter: length
  drift_type: linear
  magnitude: 0.3
  period: 350
  bounds:
  - 0.3
  - 1.0
wandb:
  project: TuneEnv
  tags:
  - cartpole
  - multi-param
  - all-4
  - chaos
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42
  target_kl: 0.01
adaptive:
  enabled: false
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
