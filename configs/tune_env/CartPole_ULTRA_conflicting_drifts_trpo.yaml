env_id: CartPole-v1
env:
- parameter: gravity
  drift_type: linear
  magnitude: 10.0
  period: 500
  bounds:
  - 5.0
  - 25.0
- parameter: masscart
  drift_type: linear
  magnitude: -0.7
  period: 500
  bounds:
  - 0.2
  - 2.0
wandb:
  project: TuneEnv
  tags:
  - cartpole
  - ultra-extreme
  - conflicting
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 200000
  seed: 42
  target_kl: 0.01
adaptive:
  enabled: false
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
