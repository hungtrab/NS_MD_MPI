# LunarLander Challenge - Gravity Jump
# Gravity nhảy giữa Moon (-1.6) và Earth (-9.8) mỗi 50 episodes
# Mục đích: Baseline PPO khó adapt khi gravity thay đổi → landing strategy khác nhau

env_id: "LunarLander-v2"

env:
  parameter: "gravity"
  drift_type: "jump"
  magnitude: -8.2      # Base=-9.8, jump to -1.8 (near Moon gravity)
  period: 50           # 50 episodes per regime
  bounds: [-12.0, -0.5]

wandb:
  project: "TuneEnv"
  tags: ["lunarlander", "gravity", "jump", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000  # LunarLander cần nhiều timesteps hơn
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
