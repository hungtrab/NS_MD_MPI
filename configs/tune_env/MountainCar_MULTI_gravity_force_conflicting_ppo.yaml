# MountainCar MULTI - Gravity + Force Conflicting Drift
# Gravity increases but force decreases!

env_id: "MountainCar-v0"

env:
  - parameter: "gravity"
    drift_type: "linear"
    magnitude: 0.002     # Gravity increases
    period: 1000
    bounds: [0.001, 0.005]
  
  - parameter: "force"
    drift_type: "linear"
    magnitude: -0.0005   # Force DECREASES (conflicting!)
    period: 1000
    bounds: [0.0003, 0.0015]

wandb:
  project: "TuneEnv"
  tags: ["mountaincar", "multi-param", "conflicting", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 200000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
