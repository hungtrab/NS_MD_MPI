# CartPole EXTREME - Very Long Pole Jump
# Pole length nhảy từ ngắn (0.3) → rất dài (1.5)
# Mục đích: Moment of inertia thay đổi drastically → khó balance

env_id: "CartPole-v1"

env:
  parameter: "length"
  drift_type: "jump"
  magnitude: 1.0        # length: 0.5 → 1.5 (pole dài gấp 3 lần)
  period: 100           # Jump nhanh mỗi 100 steps
  bounds: [0.3, 1.5]

wandb:
  project: "TuneEnv"
  tags: ["cartpole", "extreme", "length", "jump", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
