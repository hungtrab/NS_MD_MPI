# LunarLander Challenge - Turbulence Sine Wave
# Turbulence dao động → noisy observations, khó kiểm soát
# Mục đích: Agent phải học robust policy với noisy state

env_id: "LunarLander-v2"

env:
  parameter: "turbulence_power"
  drift_type: "sine"
  magnitude: 1.0       # turbulence: 0.5 ± 1.0 
  period: 30           # 30 episodes per cycle
  bounds: [0.0, 2.0]

wandb:
  project: "TuneEnv"
  tags: ["lunarlander", "turbulence", "sine", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
