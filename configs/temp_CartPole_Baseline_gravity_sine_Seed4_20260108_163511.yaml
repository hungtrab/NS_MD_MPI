# CartPole Baseline - Sine Gravity Drift - PPO
env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "sine"
  magnitude: 5.0
  period: 500

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["cartpole", "baseline", "sine", "gravity"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 4

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
