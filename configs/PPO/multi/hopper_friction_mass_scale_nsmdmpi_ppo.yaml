env_id: Hopper-v4
env:
- parameter: friction
  drift_type: sine
  magnitude: 0.27
  period: 8000
  base_value: 0.9
  bounds:
  - 0.54
  - 1.26
- parameter: mass_scale
  drift_type: linear
  magnitude: 0.3
  period: 10000
  base_value: 1.0
  bounds:
  - 0.6
  - 1.4
wandb:
  project: NS_MDMPI_Hopper
  tags:
  - hopper
  - multi-param
  - ppo
  - friction+mass_scale
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
nsmdmpi:
  enabled: true
  V_R: 80.0
  V_P: 150.0
  V_pi_star: 1000.0
  kappa_base: 0.01
  kappa_min: 0.15
  kappa_max: 0.4
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
