env_id: HalfCheetah-v4
env:
- parameter: friction
  drift_type: sine
  magnitude: 0.27
  period: 8000
  base_value: 0.9
  bounds:
  - 0.54
  - 1.26
- parameter: damping
  drift_type: linear
  magnitude: 0.3
  period: 10000
  base_value: 1.0
  bounds:
  - 0.6
  - 1.4
wandb:
  project: att_3_Multi_Baseline
  tags:
  - half cheetah
  - multi-param
  - ppo
  - friction+damping
  - baseline
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
