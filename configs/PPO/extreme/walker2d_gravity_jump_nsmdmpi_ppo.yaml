env_id: Walker2d-v4
env:
  parameter: gravity
  drift_type: jump
  magnitude: 0.6
  period: 50000
  base_value: -9.81
  bounds:
  - -11.0
  - -8.0
wandb:
  project: att_19_Walker2d
  tags:
  - walker2d
  - extreme
  - ppo
  - gravity
  - jump
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 2000000
  seed: 42
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
nsmdmpi:
  enabled: true
  V_R: 200.0
  V_P: 300.0
  V_pi_star: 1200.0
  kappa_base: 0.2
  kappa_min: 0.15
  kappa_max: 0.4
  lambda_base: 1.0
  kappa_adaptive: true
  lambda_adaptive: true
  trust_region_sensitivity: 1.0
  regularization_sensitivity: 1.0
  max_ent_coef: 0.1
  drift_window_size: 1000
  log_freq: 50
  save_budget_history: true
  budget_save_dir: budgets/
  verbose: 1
