env_id: HalfCheetah-v4
env:
  parameter: damping
  drift_type: sine
  magnitude: 0.3
  period: 10000
  base_value: 1.0
  bounds:
  - 0.5
  - 1.5
wandb:
  project: att_3_HalfCheetah_Moderate_Comparison
  tags:
  - half cheetah
  - moderate
  - ppo
  - damping
  - sine
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
