env_id: LunarLander-v3
env:
  parameter: wind_power
  drift_type: sine
  magnitude: 5.0
  period: 50000
  base_value: 10.0
  bounds:
  - 5.0
  - 15.0
wandb:
  project: att_3_LunarLander_Drift_Study
  tags:
  - lunarlander
  - moderate
  - ppo
  - wind_power
  - sine
  - baseline
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
# No nsmdmpi section - this is baseline
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
