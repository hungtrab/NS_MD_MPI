env_id: Swimmer-v4
env:
  parameter: mass_scale
  drift_type: linear
  magnitude: 0.15
  period: 10000
  base_value: 1.0
  bounds:
  - 0.7
  - 1.3
wandb:
  project: att_3_Swimmer_Moderate_Comparison
  tags:
  - swimmer
  - moderate
  - ppo
  - mass_scale
  - linear
  - nsmdmpi
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
