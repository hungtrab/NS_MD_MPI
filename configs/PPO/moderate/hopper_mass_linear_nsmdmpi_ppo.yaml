env_id: Hopper-v4
env:
  parameter: mass_scale
  drift_type: linear
  magnitude: 0.3
  period: 500000
  base_value: 1.0
  bounds:
  - 0.7
  - 1.3
wandb:
  project: att_3_Hopper_Drift_Study
  tags:
  - hopper
  - moderate
  - ppo
  - mass_scale
  - linear
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
nsmdmpi:
  enabled: true
  V_R: 100.0
  V_P: 150.0
  V_pi_star: 600.0
  kappa_base: 0.2
  kappa_min: 0.1
  kappa_max: 0.4
  lambda_base: 1.0
  kappa_adaptive: true
  lambda_adaptive: true
  trust_region_sensitivity: 2.0
  regularization_sensitivity: 1.0
  max_ent_coef: 0.1
  drift_window_size: 1000
  log_freq: 50
  save_budget_history: true
  budget_save_dir: budgets/
  verbose: 1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
