env_id: LunarLander-v3
env:
  parameter: wind_power
  drift_type: linear
  magnitude: 0.3
  period: 15000
  base_value: 0.0
  bounds:
  - -5.0
  - 15.0
wandb:
  project: att_19_LunarLander
  tags:
  - lunarlander
  - moderate
  - ppo
  - wind_power
  - linear
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
nsmdmpi:
  enabled: true
  V_R: 25.0
  V_P: 50.0
  V_pi_star: 500.0
  kappa_base: 0.2
  lambda_base: 1.0
  kappa_adaptive: true
  lambda_adaptive: true
  trust_region_sensitivity: 1.0
  regularization_sensitivity: 1.0
  max_ent_coef: 0.1
  drift_window_size: 1000
  log_freq: 50
  save_budget_history: true
  budget_save_dir: budgets/
  verbose: 1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
