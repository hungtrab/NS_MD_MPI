env_id: LunarLander-v3
env:
  parameter: gravity
  drift_type: sine
  magnitude: 3.0
  period: 10000
  base_value: -10.0
  bounds:
  - -11.9
  - -5.0
wandb:
  project: att_3_LunarLander_Moderate_Comparison
  tags:
  - lunarlander
  - moderate
  - ppo
  - gravity
  - sine
  - nsmdmpi
  mode: online
train:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.2
  lambda_base: 1.0
  kappa_adaptive: true
  lambda_adaptive: true
  trust_region_sensitivity: 5.0
  regularization_sensitivity: 2.0
  max_ent_coef: 0.1
  drift_window_size: 1000
  log_freq: 50  # Log every 50 steps for detailed tracking
  save_budget_history: true  # Save budget history for analysis
  budget_save_dir: budgets/
  verbose: 1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
