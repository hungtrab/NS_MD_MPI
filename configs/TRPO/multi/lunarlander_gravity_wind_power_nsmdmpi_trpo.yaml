env_id: LunarLander-v3
env:
- parameter: gravity
  drift_type: sine
  magnitude: 3.0
  period: 8000
  base_value: -10.0
  bounds:
  - -11.9
  - -6.0
- parameter: wind_power
  drift_type: linear
  magnitude: 0.3
  period: 10000
  base_value: 0.0
  bounds:
  - 0.1
  - 0.0
wandb:
  project: att_4_Multi_NSMDMPI
  tags:
  - lunarlander
  - multi-param
  - trpo
  - gravity+wind_power
  - nsmdmpi
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42
  target_kl: 0.01
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
