env_id: Hopper-v4
env:
  parameter: mass_scale
  drift_type: sine
  magnitude: 0.3
  period: 10000
  base_value: 1.0
  bounds:
  - 0.5
  - 1.5
wandb:
  project: att_3_Moderate_Baseline
  tags:
  - hopper
  - moderate
  - trpo
  - mass_scale
  - sine
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
  target_kl: 0.01
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
