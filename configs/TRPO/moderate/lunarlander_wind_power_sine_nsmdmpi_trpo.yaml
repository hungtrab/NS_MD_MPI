env_id: LunarLander-v3
env:
  parameter: wind_power
  drift_type: sine
  magnitude: 0.3
  period: 10000
  base_value: 0.0
wandb:
  project: att_3_Moderate_NSMDMPI
  tags:
  - lunarlander
  - moderate
  - trpo
  - wind_power
  - sine
  - nsmdmpi
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42
  target_kl: 0.01
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
