env_id: LunarLander-v3
env:
  parameter: gravity
  drift_type: random_walk
  sigma: 0.3
  period: 1000
  base_value: -10.0
  bounds:
  - -11.9
  - -1.0
wandb:
  project: att_4_Extreme_Baseline
  tags:
  - lunarlander
  - extreme
  - trpo
  - gravity
  - random_walk
  - baseline
  mode: online
train:
  algorithm: TRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42
  target_kl: 0.01
nsmdmpi:
  enabled: false
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
