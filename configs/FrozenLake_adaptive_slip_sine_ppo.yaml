# FrozenLake Adaptive - Sine Slip Drift - PPO
env_id: "FrozenLake-v1"

env:
  parameter: "slip_prob"
  drift_type: "sine"
  magnitude: 0.15
  period: 20000

env_kwargs:
  is_slippery: true
  map_name: "4x4"

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["frozenlake", "adaptive", "sine", "slip"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.001
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42

adaptive:
  enabled: true
  scale_factor: 0.25
  min_lr_multiplier: 0.5
  max_lr_multiplier: 3.0
  adapt_clip_range: true
  base_clip_range: 0.2
  adapt_entropy: true
  base_ent_coef: 0.05

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
