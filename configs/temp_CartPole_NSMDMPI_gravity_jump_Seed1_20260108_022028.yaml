# CartPole NS-MD-MPI - Jump Gravity Drift - PPO
env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "jump"
  magnitude: 8.0
  period: 500

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["cartpole", "nsmdmpi", "jump", "gravity"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 1

adaptive:
  enabled: false

nsmdmpi:
  enabled: true
  V_R: 80.0
  V_P: 80.0
  V_pi_star: 40.0
  auto_estimate_budgets: false
  budget_scale_factor: 2.0
  
  kappa_base: 0.2
  kappa_min: 0.05
  kappa_max: 0.35
  kappa_adaptive: true
  trust_region_sensitivity: 0.3
  
  lambda_base: 1.0
  lambda_min: 0.2
  lambda_max: 5.0
  lambda_adaptive: true
  regularization_sensitivity: 0.7
  
  ema_tau: 0.05
  gamma: 0.99
  B_value_bound: 1.0
  
  drift_weights:
    reward: 1.0
    transition: 1.0
    commutator: 0.5
  
  drift_window_size: 2000
  drift_min_samples: 200
  
  adapt_entropy: true
  base_ent_coef: 0.01
  min_ent_coef: 0.0
  max_ent_coef: 0.1
  
  log_freq: 100
  save_budget_history: true
  budget_save_dir: "budgets/"
  verbose: 1

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
