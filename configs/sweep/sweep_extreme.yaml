# W&B Sweep Config for Extreme Drift NS-MDMPI
# Usage: wandb sweep configs/sweep/sweep_extreme.yaml
# Then run: wandb agent <SWEEP_ID>

program: scripts/wandb_sweep_agent.py
method: bayes
name: NS-MDMPI Extreme Drift Tuning

metric:
  name: optimization_score
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 3
  s: 2

parameters:
  # === NS-MDMPI Parameters (TUNING) ===
  V_R:
    distribution: uniform
    min: 20.0
    max: 50.0
  
  V_P:
    distribution: uniform
    min: 20.0
    max: 50.0
  
  V_pi_star:
    distribution: uniform
    min: 10.0
    max: 25.0
  
  kappa_base:
    distribution: uniform
    min: 0.15
    max: 0.4
  
  lambda_base:
    distribution: uniform
    min: 1.0
    max: 5.0
  
  trust_region_sensitivity:
    distribution: uniform
    min: 5.0
    max: 20.0
  
  regularization_sensitivity:
    distribution: uniform
    min: 3.0
    max: 10.0
  
  max_ent_coef:
    distribution: uniform
    min: 0.05
    max: 0.2
  
  drift_window_size:
    distribution: int_uniform
    min: 200
    max: 1000

  # === Fixed Parameters ===
  env_id:
    value: Hopper-v4
  
  drift_parameter:
    value: friction
  
  drift_type:
    value: random_walk
  
  drift_magnitude:
    value: 0.5
  
  drift_period:
    value: 5000
  
  drift_base_value:
    value: 0.9
  
  total_timesteps:
    value: 200000
  
  n_envs:
    value: 4
  
  seed:
    value: 42
  
  learning_rate:
    value: 0.0003
  
  n_steps:
    value: 2048
  
  batch_size:
    value: 64
  
  gamma:
    value: 0.99
