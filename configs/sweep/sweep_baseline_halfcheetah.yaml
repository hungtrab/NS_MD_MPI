# W&B Sweep Config for Baseline PPO Tuning
# Usage: wandb sweep configs/sweep/sweep_baseline_hopper.yaml
# Then run: wandb agent <SWEEP_ID>

program: scripts/wandb_sweep_agent.py
method: bayes
name: Baseline PPO HalfCheetah Tuning

metric:
  name: mean_reward
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 3
  s: 2

parameters:
  # === PPO Parameters (TUNING) ===
  learning_rate:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.001
  
  n_steps:
    values: [1024, 2048, 4096]
  
  batch_size:
    values: [32, 64, 128, 256]
  
  gamma:
    values: [0.99, 0.995, 0.999]
  
  clip_range:
    distribution: uniform
    min: 0.1
    max: 0.3
  
  ent_coef:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  
  vf_coef:
    distribution: uniform
    min: 0.3
    max: 0.7

  # === Fixed Parameters ===
  env_id:
    value: HalfCheetah-v4
  
  drift_parameter:
    value: friction
  
  drift_type:
    value: sine
  
  drift_magnitude:
    value: 0.27
  
  drift_period:
    value: 50000
  
  drift_base_value:
    value: 0.9
  
  total_timesteps:
    value: 200000
  
  n_envs:
    value: 4
  
  seed:
    value: 42
  
  # NS-MDMPI disabled for baseline
  nsmdmpi_enabled:
    value: false
