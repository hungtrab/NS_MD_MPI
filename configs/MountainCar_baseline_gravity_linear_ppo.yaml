# MountainCar Baseline - Linear Gravity Drift - PPO
env_id: "MountainCar-v0"

env:
  parameter: "gravity"
  drift_type: "linear"
  magnitude: 0.0015
  period: 10000

wandb:
  project: "NSMDMPI_EXP"
  entity: null
  tags: ["mountaincar", "baseline", "linear", "gravity"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0002
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 5000000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
