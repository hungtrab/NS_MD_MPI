# HalfCheetah Baseline - Sine Friction Drift - SAC
env_id: "HalfCheetah-v4"

env:
  parameter: "friction"
  drift_type: "sine"
  magnitude: 0.3
  period: 5000  

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["halfcheetah", "baseline", "sine", "friction", "sac"]
  mode: "online"

train:
  algorithm: "SAC"
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  total_timesteps: 1000000
  seed: 3

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
