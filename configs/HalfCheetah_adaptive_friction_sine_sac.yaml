# HalfCheetah Adaptive - Sine Friction Drift - SAC
env_id: "HalfCheetah-v4"

env:
  parameter: "friction"
  drift_type: "sine"
  magnitude: 0.3
  period: 50000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["halfcheetah", "adaptive", "sine", "friction", "sac"]
  mode: "online"

train:
  algorithm: "SAC"
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  total_timesteps: 1000000
  seed: 42

adaptive:
  enabled: true
  scale_factor: 0.1
  min_lr_multiplier: 0.5
  max_lr_multiplier: 3.0
  adapt_clip_range: false
  adapt_entropy: true
  base_ent_coef: 0.2

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
