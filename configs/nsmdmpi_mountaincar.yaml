# ============================================================================
# NS-MD-MPI CONFIGURATION: MountainCar with Variation Budgets
# ============================================================================
#
# This config implements Algorithm 1 (NS-MD-MPI) from the paper:
# "Regularized Non-Stationary Markov Decision Processes"
#
# Key Concepts:
# - Variation Budgets (V_R, V_P, V_π*): Bound total environment non-stationarity
# - Trust Region (κ_t): Shrinks as budgets are consumed
# - Regularization (λ_t): Increases with detected drift
#
# Comparison Modes:
# 1. Baseline:  nsmdmpi.enabled=false, adaptive.enabled=false
# 2. Adaptive:  nsmdmpi.enabled=false, adaptive.enabled=true (heuristic)
# 3. NS-MD-MPI: nsmdmpi.enabled=true (theoretical)
#
# ============================================================================

# Environment Configuration
env_id: "MountainCar-v0"

env:
  parameter: "gravity"
  drift_type: "sine"           # Smooth oscillation for reproducible experiments
  magnitude: 0.001               # Moderate drift: gravity varies from 9.8 to 14.8
  period: 20000                # One cycle per 20k steps

# Weights & Biases Logging
wandb:
  project: "NSMDMPI_MountainCar"
  entity: null
  tags: ["nsmdmpi", "sine_gravity", "variation_budgets"]
  mode: "online"

# Training Configuration
train:
  algorithm: "PPO"             # PPO works best with trust region adaptation
  learning_rate: 0.0002        # Reduced for more stable learning
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 10000000    # Increased for better convergence
  seed: 42

# ============================================================================
# NS-MD-MPI Configuration (Algorithm 1)
# ============================================================================
nsmdmpi:
  # --- Enable NS-MD-MPI ---
  enabled: true                # Set to false for baseline/adaptive comparison
  
  # --- Variation Budgets (Section 3) ---
  # These bound the total non-stationarity over the training horizon:
  #   V_R: Cumulative reward function changes
  #   V_P: Cumulative transition dynamics changes
  #   V_π*: Cumulative optimal policy changes
  #
  # Estimation: For sine drift with magnitude=0.001, period=20k, horizon=5M:
  #   - 250 cycles total
  #   - V_R ≈ magnitude × sqrt(n_cycles) × scale ≈ 0.001 × 15.81 × 2.0 ≈ 0.032
  #   - V_P ≈ V_R (similar variation)
  #   - V_π* ≈ 0.5 × max(V_R, V_P) (policy adapts slower)
  
  V_R: 0.05                    # Reward variation budget (increased for robustness)
  V_P: 0.05                    # Transition variation budget (increased for robustness)
  V_pi_star: 0.025              # Optimal policy variation budget (increased for robustness)
  
  # Auto-estimate budgets from drift config (overrides manual values if true)
  auto_estimate_budgets: false
  budget_scale_factor: 2.0     # Multiplier for auto-estimation (>1 = more conservative)
  
  # --- Trust Region Adaptation (story.md Sec 2 & 7.3) ---
  # Adaptive schedule: δ_t = clip(δ_min, δ_max, c_0 + c_1 · EMA_τ(Δ̂_t))
  #
  # Where: Δ̂_t = Δ̂_t^R + 2γB·Δ̂_t^P (Bellman Commutator proxy)
  #
  # Interpretation:
  #   - c_0 (kappa_base): Baseline trust region when drift = 0
  #   - c_1 (trust_region_sensitivity): How much to grow trust region with drift
  #   - EMA_τ: Exponential moving average smooths drift estimates
  
  kappa_base: 0.2              # c_0: Base trust region (clip_range for PPO)
  kappa_min: 0.05              # δ_min: Minimum trust region
  kappa_max: 0.35              # δ_max: Maximum trust region (reduced for stability)
  kappa_adaptive: true         # Enable adaptive schedule
  
  # Sensitivity parameter c_1:
  #   - Positive c_1 → larger trust region when drifting (more exploration)
  #   - Recommended: 0.1-1.0 for moderate sensitivity
  trust_region_sensitivity: 0.3  # Reduced for more conservative adaptation
  
  # --- Temperature Adaptation (story.md Sec 2 & 7.3) ---
  # Temperature form: η_t = clip(η_min, η_max, d_0 + d_1 · EMA_τ(Δ̂_t))
  #
  # Used for Mirror Descent with dynamic regularization coefficient
  #
  # Interpretation:
  #   - d_0 (lambda_base): Baseline temperature when drift = 0
  #   - d_1 (regularization_sensitivity): How much to increase temperature with drift
  #   - Higher η_t → less regularization → larger policy updates
  
  lambda_base: 1.0             # d_0: Base temperature coefficient
  lambda_min: 0.2              # η_min: Minimum temperature (increased for stability)
  lambda_max: 5.0              # η_max: Maximum temperature (reduced to prevent over-adaptation)
  lambda_adaptive: true        # Enable adaptive schedule
  
  # Sensitivity parameter d_1:
  #   - Positive d_1 → higher temperature when drifting (less regularization)
  #   - Recommended: 0.5-2.0 for moderate sensitivity
  regularization_sensitivity: 0.7  # Reduced for smoother regularization changes
  
  # --- EMA Parameters (story.md Sec 7.3) ---
  # Exponential Moving Average window for smoothing drift estimates
  # τ controls how much weight is given to recent observations:
  #   - Small τ (0.01-0.05) → more smoothing, slower adaptation
  #   - Large τ (0.1-0.3) → less smoothing, faster adaptation
  ema_tau: 0.05                # Reduced for smoother, more robust adaptation
  
  # --- Bellman Commutator Parameters ---
  # Combined drift: Δ̂_t = Δ̂_t^R + 2γB·Δ̂_t^P
  gamma: 0.99                  # Discount factor
  B_value_bound: 1.0           # Q-value bound estimate (TODO: compute from returns)
  
  # --- Drift Estimation (story.md Sec 2) ---
  # DEPRECATED: drift_weights (now using Bellman Commutator formula)
  # Combined drift is computed as: Δ̂_t = Δ̂_t^R + 2γB·Δ̂_t^P
  drift_weights:
    reward: 1.0                # Used only for logging
    transition: 1.0            # Used only for logging
    commutator: 0.5            # Used only for logging
  
  drift_window_size: 2000      # Window for drift estimation (increased for stability)
  drift_min_samples: 200       # Minimum samples before estimating (increased for reliability)
  
  # --- Entropy Adaptation (Exploration) ---
  # Increase exploration when environment is changing
  adapt_entropy: true
  base_ent_coef: 0.0           # Base entropy coefficient (0 = auto-detect from model)
  min_ent_coef: 0.0
  max_ent_coef: 0.1
  
  # --- Logging & Tracking ---
  log_freq: 100                # Log metrics every N steps
  save_budget_history: true    # Save budget consumption history
  budget_save_dir: "budgets/"  # Directory for budget history files
  
  verbose: 1                   # 0=quiet, 1=info, 2=debug

# ============================================================================
# Baseline Adaptive (for comparison)
# ============================================================================
# This is the heuristic adaptive method (not NS-MD-MPI)
# Enable for baseline comparison experiments
adaptive:
  enabled: false               # Set true for baseline comparison
  scale_factor: 0.1
  min_lr_multiplier: 0.5
  max_lr_multiplier: 3.0
  adapt_clip_range: true
  adapt_entropy: true

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
# ============================================================================
# Experiment Variants
# ============================================================================
# Run these to validate the paper's predictions:
#
# 1. Zero-Drift Baseline:
#    - env.drift_type: "static"
#    - nsmdmpi.enabled: false
#    - Expected: Matches stationary PPO performance
#
# 2. NS-MD-MPI with Sine Drift:
#    - env.drift_type: "sine", magnitude: 5.0
#    - nsmdmpi.enabled: true
#    - Expected: Low regret, efficient budget usage
#
# 3. NS-MD-MPI with Jump Drift:
#    - env.drift_type: "jump", magnitude: 10.0
#    - nsmdmpi.enabled: true
#    - Expected: Trust region adapts to sudden change
#
# 4. Budget Exhaustion Test:
#    - env.magnitude: 10.0 (high drift)
#    - nsmdmpi.V_R: 10.0 (small budget)
#    - Expected: κ_t → 0, very conservative updates
#
# 5. Comparison: NS-MD-MPI vs Adaptive:
#    - Run with nsmdmpi.enabled=true, then adaptive.enabled=true
#    - Compare dynamic regret and budget efficiency
#
# ============================================================================
