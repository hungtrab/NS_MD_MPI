# CartPole Baseline - Jump Gravity Drift - PPO
env_id: "CartPole-v1"

env:
  parameter: "gravity"
  drift_type: "jump"
  magnitude: 8.0
  period: 500

wandb:
  project: "NSMDMPI_EXP"
  entity: null
  tags: ["cartpole", "baseline", "jump", "gravity"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 100000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
