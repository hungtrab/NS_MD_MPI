# MiniGrid NS-MD-MPI - Sine Reward Drift - PPO
env_id: "MiniGrid-Dynamic-Obstacles-8x8-v0"

env:
  parameter: "reward_scale"
  drift_type: "sine"
  magnitude: 0.5
  period: 5000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["minigrid", "nsmdmpi", "sine", "reward"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 0

adaptive:
  enabled: false

nsmdmpi:
  enabled: true
  V_R: 1.0
  V_P: 0.5
  V_pi_star: 0.5
  auto_estimate_budgets: false
  budget_scale_factor: 2.0
  
  kappa_base: 0.2
  kappa_min: 0.05
  kappa_max: 0.35
  kappa_adaptive: true
  trust_region_sensitivity: 0.3
  
  lambda_base: 1.0
  lambda_min: 0.2
  lambda_max: 5.0
  lambda_adaptive: true
  regularization_sensitivity: 0.7
  
  ema_tau: 0.06
  gamma: 0.99
  B_value_bound: 1.0
  
  drift_weights:
    reward: 2.0
    transition: 0.5
    commutator: 0.5
  
  drift_window_size: 1000
  drift_min_samples: 100
  
  adapt_entropy: true
  base_ent_coef: 0.01
  min_ent_coef: 0.0
  max_ent_coef: 0.1
  
  log_freq: 100
  save_budget_history: true
  budget_save_dir: "budgets/"
  verbose: 1

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
