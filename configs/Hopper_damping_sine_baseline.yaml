# Hopper Challenge - Damping Sine Wave
# Damping dao động → joint stiffness thay đổi
# Mục đích: Hopping behavior sẽ khác nhau với damping khác nhau

env_id: "Hopper-v4"

env:
  parameter: "damping"
  drift_type: "sine"
  magnitude: 1.5        # damping: 1.0 ± 1.5 oscillating
  period: 8000
  bounds: [0.3, 3.0]

wandb:
  project: "TuneEnv"
  tags: ["hopper", "mujoco", "damping", "sine", "baseline"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
