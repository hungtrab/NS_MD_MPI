# MountainCar NS-MD-MPI - Jump Force Drift - PPO
env_id: "MountainCar-v0"

env:
  parameter: "force"
  drift_type: "jump"
  magnitude: 0.0005
  period: 10000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["mountaincar", "nsmdmpi", "jump", "force"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0002
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 5000000
  seed: 3

adaptive:
  enabled: false

nsmdmpi:
  enabled: true
  V_R: 8.0
  V_P: 8.0
  V_pi_star: 4.0
  auto_estimate_budgets: false
  budget_scale_factor: 2.0
  
  kappa_base: 0.2
  kappa_min: 0.05
  kappa_max: 0.35
  kappa_adaptive: true
  trust_region_sensitivity: 0.3
  
  lambda_base: 1.0
  lambda_min: 0.2
  lambda_max: 5.0
  lambda_adaptive: true
  regularization_sensitivity: 0.7
  
  ema_tau: 0.05
  gamma: 0.99
  B_value_bound: 1.0
  
  drift_weights:
    reward: 1.0
    transition: 1.0
    commutator: 0.5
  
  drift_window_size: 2000
  drift_min_samples: 200
  
  adapt_entropy: true
  base_ent_coef: 0.0
  min_ent_coef: 0.0
  max_ent_coef: 0.05
  
  log_freq: 100
  save_budget_history: true
  budget_save_dir: "budgets/"
  verbose: 1

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
