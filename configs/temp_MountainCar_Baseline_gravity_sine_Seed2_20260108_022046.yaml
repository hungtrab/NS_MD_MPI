# MountainCar Baseline - Sine Gravity Drift - PPO
env_id: "MountainCar-v0"

env:
  parameter: "gravity"
  drift_type: "sine"
  magnitude: 0.001
  period: 5000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["mountaincar", "baseline", "sine", "gravity"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0002
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 5000000
  seed: 2

adaptive:
  enabled: false

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
