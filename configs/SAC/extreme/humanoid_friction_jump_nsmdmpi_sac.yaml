env_id: Humanoid-v4
env:
  parameter: friction
  drift_type: jump
  magnitude: 0.3
  period: 10000
  base_value: 0.9
  bounds:
  - 0.7
  - 1.3
wandb:
  project: att_3_Humanoid_Extreme_Comparison
  tags:
  - humanoid
  - extreme
  - sac
  - friction
  - jump
  - nsmdmpi
  - nsmdmpi
  mode: online
train:
  algorithm: SAC
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 2000000
  seed: 42
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
