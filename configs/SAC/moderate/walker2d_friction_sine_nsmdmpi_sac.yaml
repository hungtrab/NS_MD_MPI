env_id: Walker2d-v4
env:
  parameter: friction
  drift_type: sine
  magnitude: 0.2
  period: 10000
  base_value: 0.9
  bounds:
  - 0.6
  - 1.4
wandb:
  project: att_3_Walker2d_Moderate_Comparison
  tags:
  - walker2d
  - moderate
  - sac
  - friction
  - sine
  - nsmdmpi
  - nsmdmpi
  mode: online
train:
  algorithm: SAC
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  total_timesteps: 1000000
  seed: 42
paths:
  log_dir: logs/
  model_dir: models/
  video_dir: videos/
nsmdmpi:
  enabled: true
  V_R: 10.0
  V_P: 10.0
  V_pi_star: 5.0
  kappa_base: 0.01
  lambda_base: 0.01
  kappa_adaptive: true
  lambda_adaptive: true
  sensitivity: 0.1
