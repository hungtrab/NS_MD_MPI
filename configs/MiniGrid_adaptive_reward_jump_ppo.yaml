# MiniGrid Adaptive - Jump Reward Drift - PPO
env_id: "MiniGrid-Dynamic-Obstacles-8x8-v0"

env:
  parameter: "reward_scale"
  drift_type: "jump"
  magnitude: 0.7
  period: 250000

wandb:
  project: "NS-MDP-Experiments"
  entity: null
  tags: ["minigrid", "adaptive", "jump", "reward"]
  mode: "online"

train:
  algorithm: "PPO"
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 64
  gamma: 0.99
  total_timesteps: 500000
  seed: 42

adaptive:
  enabled: true
  scale_factor: 0.2
  min_lr_multiplier: 0.5
  max_lr_multiplier: 3.0
  adapt_clip_range: true
  base_clip_range: 0.2
  adapt_entropy: true
  base_ent_coef: 0.01

nsmdmpi:
  enabled: false

paths:
  log_dir: "logs/"
  model_dir: "models/"
  video_dir: "videos/"
